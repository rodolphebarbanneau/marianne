appId: io.github.rodolphebarbanneau.marianne
productName: Marianne
copyright: Copyright © 2026 Rodolphe Barbanneau
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
npmRebuild: false

# .marianne files show the archive's icon (scripts/generate-icons.mjs), and a double click opens them in
# Marianne (src/main/opened-archives.ts). The Windows installer registers them for the user, the macOS
# app declares them (and exports their type, below, for Finder), the .deb installs their type and icons.
# `name` is the Windows ProgID; `description`, the name people see.
fileAssociations:
  - ext: marianne
    name: Marianne.Archive
    description: Archive Marianne
    icon: archive
    role: Editor
    rank: Owner

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Marianne

# Apple Silicon (arm64) and Intel (x64) builds. The updater picks the zip matching the Mac.
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The archive's type, owned by Marianne: Finder shows its name and icon, and opens it with the app.
  extendInfo:
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: io.github.rodolphebarbanneau.marianne.archive
        UTTypeDescription: Archive Marianne
        UTTypeConformsTo: [public.data]
        UTTypeIconFile: archive.icns
        UTTypeTagSpecification:
          public.filename-extension: [marianne]
          public.mime-type: application/x-marianne
# Name both installers by chip (the default leaves x64 unnamed).
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: build/icon.png
  synopsis: Assistant citoyen pour les démarches et les données publiques françaises
  maintainer: Rodolphe Barbanneau
  desktop:
    entry:
      StartupWMClass: Marianne
  mimeTypes: [application/x-marianne]
# The .marianne type and its icon, from build/mime: electron-builder's own declaration would give these
# files the generic document icon. Paths from apps/desktop, where electron-builder runs.
deb:
  fpm:
    - build/mime/marianne.xml=/usr/share/mime/packages/marianne.xml
    - build/mime/16.png=/usr/share/icons/hicolor/16x16/mimetypes/application-x-marianne.png
    - build/mime/24.png=/usr/share/icons/hicolor/24x24/mimetypes/application-x-marianne.png
    - build/mime/32.png=/usr/share/icons/hicolor/32x32/mimetypes/application-x-marianne.png
    - build/mime/48.png=/usr/share/icons/hicolor/48x48/mimetypes/application-x-marianne.png
    - build/mime/64.png=/usr/share/icons/hicolor/64x64/mimetypes/application-x-marianne.png
    - build/mime/128.png=/usr/share/icons/hicolor/128x128/mimetypes/application-x-marianne.png
    - build/mime/256.png=/usr/share/icons/hicolor/256x256/mimetypes/application-x-marianne.png
    - build/mime/512.png=/usr/share/icons/hicolor/512x512/mimetypes/application-x-marianne.png

# Releases on GitHub double as the update feed: installers + latest*.yml manifests read by
# electron-updater. CI creates a draft; publishing it rolls the update out to every install.
publish:
  provider: github
  owner: rodolphebarbanneau
  repo: marianne
  releaseType: draft
