name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      # No stray .gitkeep beside real files: what `npm run check` runs, CI runs too (AGENTS.md).
      - name: Stray .gitkeep
        run: node scripts/check-gitkeep.mjs

      # No <placeholder> outside code in Markdown, which renderers drop as an HTML tag.
      - name: Markdown placeholders
        run: node scripts/check-markdown.mjs

      # What each package may import (docs/design.md, "The code").
      - name: Package boundaries
        run: node scripts/check-boundaries.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The website (site/), a project of its own: its types, then a static build. It renders docs/guide,
  # so a guide page that breaks it shows here. The token only lifts GitHub's rate limit on the releases.
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # A packaged build on each platform, without publishing: catches packaging regressions early.
  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Unpacked, except on Linux: the real .deb, to check what it installs.
      - name: Package
        shell: bash
        working-directory: apps/desktop
        run: |
          args=(--dir)
          if [ "$RUNNER_OS" = macOS ]; then args+=(-c.mac.identity=null); fi
          if [ "$RUNNER_OS" = Linux ]; then args=(--linux deb); fi
          npm run build && npx electron-builder --publish never "${args[@]}"

      # .marianne files get their type and icon from the package (electron-builder.yml).
      - name: Check the archive file type
        if: runner.os != 'Windows'
        shell: bash
        working-directory: apps/desktop
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            deb=$(ls dist/*.deb)
            contents=$(dpkg-deb -c "$deb")
            grep -q 'usr/share/mime/packages/marianne.xml' <<<"$contents"
            for size in 16 24 32 48 64 128 256 512; do grep -q "hicolor/${size}x${size}/mimetypes/application-x-marianne.png" <<<"$contents"; done
            dpkg-deb --fsys-tarfile "$deb" | tar -xO --wildcards './usr/share/applications/*.desktop' | grep -q 'MimeType=application/x-marianne;'
          else
            app=$(ls -d dist/mac*/Marianne.app | head -1)
            test -f "$app/Contents/Resources/archive.icns"
            plutil -convert json -o - "$app/Contents/Info.plist" | node -e '
              const plist = JSON.parse(require("fs").readFileSync(0, "utf8"))
              const doc = plist.CFBundleDocumentTypes?.find((t) => t.CFBundleTypeExtensions?.includes("marianne"))
              const uti = plist.UTExportedTypeDeclarations?.find((t) => t.UTTypeTagSpecification?.["public.filename-extension"]?.includes("marianne"))
              if (doc?.CFBundleTypeIconFile !== "archive.icns" || uti?.UTTypeIconFile !== "archive.icns") throw new Error("the .marianne type is not declared: " + JSON.stringify({ doc, uti }))
            '
          fi
