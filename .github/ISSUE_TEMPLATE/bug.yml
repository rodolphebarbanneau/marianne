name: Bug report
description: Something doesn't work, or not as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Marianne. Don't write **any personal data** here (social security number, address, tax number…): this report is public.

        In the app, the bug icon at the top right fills this form in for you: your words, an analysis by your own engine, and the app's diagnostics, with what is personal left out.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Marianne did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Click on…
  - type: textarea
    id: analysis
    attributes:
      label: Analysis
      description: Written in the app by the reporter's own engine, from their words and the diagnostics below. Expected, actual, evidence, likely cause.
  - type: input
    id: version
    attributes:
      label: Version
      description: In the app, Réglages › À propos et mises à jour, or the guide (F1).
      placeholder: 0.1.0-alpha.4
    validations:
      required: true
  # Text fields rather than lists: GitHub fills only those from the address the app opens.
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15 (Apple silicon), Ubuntu 24.04…
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Engine
      description: Claude Code, Codex, Mistral Vibe, or none.
      placeholder: Claude Code
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Filled in by the app with the environment, the screen, the window's errors, the conversation's course (never its words) and the end of the log.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If you can, with anything personal hidden.
