name: Idea
description: An improvement, a procedure or a service you're missing.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea. Don't write **any personal data** here: this message is public.
  - type: textarea
    id: need
    attributes:
      label: The need
      description: What you'd like to do with Marianne, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How Marianne could go about it, if you have something in mind.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Chat with Marianne, Procedures (Démarches), Services, News (3615 INFOS), Archive and security, Something else]
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0-alpha.1
