name: Content correction
description: Wrong, missing or outdated information in a démarche, a skill, the calendar, a site or a news source, or a news source to propose.
labels: [content]
body:
  - type: markdown
    attributes:
      value: |
        Marianne's content is legal and practical guidance people act on: thanks for helping keep it right. Don't write **any personal data** here: this message is public.

        A news source for 3615 INFOS is a newsroom writing in French, with an open feed that works (RSS or Atom, carrying its articles).
  - type: dropdown
    id: kind
    attributes:
      label: What is it
      options: [A guided démarche, A skill, A calendar date, A public site, A news source, A news source to propose, Something else]
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Its title in the app, or its file in `packages/content/`; for a news source to propose, its name and site.
      placeholder: packages/content/procedures/taxes/declare-income.md
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What's wrong
      description: What it says, and what it should say instead; for a news source to propose, its feeds (the front page's, and its sections').
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Official source
      description: A link to the text or page that says so (Légifrance, service-public.fr, the administration concerned…); for a news source, its site.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0-alpha.4
