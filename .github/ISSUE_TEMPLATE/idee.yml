name: Une idée
description: Une amélioration, une démarche ou un service qui vous manque.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Merci de proposer une idée. N’écrivez ici **aucune donnée personnelle** : ce message est public.
  - type: textarea
    id: need
    attributes:
      label: Le besoin
      description: Ce que vous aimeriez faire avec Marianne, et ce qui vous en empêche aujourd’hui.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Votre idée
      description: Comment Marianne pourrait s’y prendre, si vous avez une piste.
  - type: dropdown
    id: area
    attributes:
      label: Ça concerne
      options: [la conversation avec Marianne, les démarches, les services, les actualités, l’archive et la sécurité, autre chose]
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0-alpha.1
