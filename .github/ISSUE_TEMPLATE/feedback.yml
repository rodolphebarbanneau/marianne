name: Feedback
description: What you liked, what got in your way, what surprised you.
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        Don't write **any personal data** here: this message is public.
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0-alpha.4
